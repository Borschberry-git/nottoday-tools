<style>
  :root{--paper:#faf8f3;--ink:#1d1d1b;--gray:#6b6b6b}

  .card{width:126px;aspect-ratio:63/88;background:#fff;border:4px solid var(--c);border-radius:10px;

  .card .main{width:62%;height:auto;aspect-ratio:1}
  .card .dbl{display:flex;align-items:center;gap:4px}
  .card .dbl .ico{width:52px;height:52px}
  .card.small .dbl .ico{width:36px;height:36px}
  .x2{font-family:Calibri,"Segoe UI",Arial,sans-serif;font-weight:bold;font-size:22px;color:var(--ink)}
  .card.small .x2{font-size:16px}

<style>
  html,body{height:100%}
  body{font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:14px;overflow:auto}
  button{font:inherit;padding:6px 12px;border:1px solid #b8b1a3;background:#fff;border-radius:6px;cursor:pointer}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  button:disabled{opacity:.4;cursor:default}
  input{font:inherit;width:3.5em;padding:3px 6px;border:1px solid #b8b1a3;border-radius:6px}
  .app{display:grid;grid-template-rows:44px 1fr auto;grid-template-columns:230px 1fr;min-height:100vh;gap:10px;padding:10px;box-sizing:border-box}
  .bar{grid-column:1/3;display:flex;gap:12px;align-items:center;padding:0 6px}
  .bar h1{font-family:Georgia,serif;font-size:18px;margin:0 10px 0 0}
  .bots{grid-row:2;grid-column:1;background:#fff;border:1px solid #e3ded3;border-radius:12px;padding:10px;overflow:auto}
  .bots h2{font-family:Georgia,serif;font-size:14px;margin:0 0 8px}
  .bot{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid #f0ece3}
  .bot .nm{width:46px;font-weight:bold;font-size:13px}
  .bot .things{display:flex;gap:4px}
  .bot .things .b{width:26px;height:26px;border-radius:6px;background:var(--c);position:relative;display:flex;align-items:center;justify-content:center}
  .bot .things .b .ico{width:20px;height:20px;background:#fff}
  .bot .things .b.x2::after{content:"×2";position:absolute;right:-4px;bottom:-6px;font-size:9px;font-weight:bold;background:#fff;color:var(--ink);border-radius:4px;padding:0 2px;border:1px solid #b8b1a3}
  .bot .st{margin-left:auto;font-size:11px;color:var(--gray)}
  /* стол */
  .table{grid-row:2;grid-column:2;background:#fff;border:1px solid #e3ded3;border-radius:12px;padding:12px;display:grid;grid-template-rows:1fr auto;gap:10px;position:relative;overflow:hidden}
  .top{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:start;justify-items:center}
  .zone{display:flex;flex-direction:column;align-items:center;gap:8px}
  .zone .ttl{font-size:12px;color:var(--gray)}
  .bottom{display:flex;gap:12px;justify-content:center;align-items:flex-end;min-height:180px}
  .bottom .ttl{position:absolute;left:14px;bottom:10px;font-size:12px;color:var(--gray)}
  /* карты места и события */
  .pc{--w:120px;width:var(--w);aspect-ratio:63/88;background:#fff;border:1px solid #b8b1a3;border-radius:calc(var(--w)*.08);display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.10);box-sizing:border-box}
  .pc.big{--w:min(345px, calc((100vw - 330px)/3 - 24px))}
  .pc .name{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:calc(var(--w)*.06);font-family:Georgia,serif;font-size:calc(var(--w)*.11);line-height:1.2}
  .pc .code{display:flex;height:calc(var(--w)*.22)}
  .pc .code span{flex:1;display:flex;align-items:center;justify-content:center;--bg:#999}
  .pc .code span svg{width:calc(var(--w)*.16);height:calc(var(--w)*.16);fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;display:block}
  .pc .code span.x{background:#d9d4c8;color:#fff;font-weight:bold;font-size:calc(var(--w)*.16)}
  .pc.back{background:#2b2a33;border-color:#2b2a33;color:#fff}
  .pc.back .brand{flex:1;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;letter-spacing:2px;font-size:calc(var(--w)*.11)}
  .pc.ev .name{flex:0 0 auto;font-weight:bold;font-size:calc(var(--w)*.085);padding:calc(var(--w)*.05) calc(var(--w)*.06) 0;justify-content:flex-start;text-align:left}
  .pc.ev .txt{flex:1;padding:calc(var(--w)*.03) calc(var(--w)*.06);font-size:calc(var(--w)*.062);line-height:1.3;overflow:hidden;color:#333}
  .pc.click{cursor:pointer;transition:transform .12s}
  .pc.click:hover{transform:translateY(-4px)}
  .pc.dim{opacity:.45}
  .slotp{--w:min(345px, calc((100vw - 330px)/3 - 24px));width:var(--w);aspect-ratio:63/88;border:2px dashed #e3ded3;border-radius:18px;box-sizing:border-box}
  .deck{position:relative}
  .deck .sh{position:absolute;inset:0;background:#2b2a33;border-radius:18px;transform:translate(4px,4px);z-index:0;opacity:.6}
  .deck .sh.b{transform:translate(8px,8px);opacity:.3}
  .deck .pc{position:relative;z-index:1}
  .cross{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--w)*.9);color:#c8262b;font-weight:bold;pointer-events:none;opacity:1;transition:opacity 1.5s ease-out;text-shadow:0 0 12px rgba(0,0,0,.4);z-index:5}
  .cross.fade{opacity:0}
  .fly{position:fixed;z-index:50;transition:left .55s ease,top .55s ease,width .55s ease,transform .55s ease;transform-style:preserve-3d}
  .discard{font-size:12px;color:var(--gray)}
  /* моя рука */
  .me{grid-row:3;grid-column:1/3;background:#fff;border:1px solid #e3ded3;border-radius:12px;padding:10px 12px;display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
  .me .grp{display:flex;flex-direction:column;gap:6px}
  .me .grp .ttl{font-size:12px;color:var(--gray)}
  .lay,.hnd{display:flex;gap:8px;flex-wrap:wrap}
  .lay{padding:6px;border:2px dashed #d9d4c8;border-radius:10px;min-height:177px}
  .slot{width:117px;aspect-ratio:63/88;border-radius:7px;border:2px dashed #e3ded3}
  .slot.pl{width:120px}
  .card.small{width:117px;border-width:4px}
  .card.small .main{width:60%}
  .card.small .dbl .ico{width:39px;height:39px}
  .card.small .x2{font-size:19px}
  .card.pick{cursor:pointer;transition:transform .08s}
  .card.pick:hover{transform:translateY(-3px)}
  .card.blocked{opacity:.35;cursor:not-allowed}
  .card.blocked:hover{transform:none}
  .card.active{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c)}
  .pc.chosen{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--ink)}
  .hint{font-size:12px;color:var(--gray)}
</style>
</head>

<script>
const THINGS = ["butylka", "telefon", "dengi", "kulaki", "bayan", "kniga", "ksiva"];
const PAIRS = [["butylka", "kulaki"], ["kulaki", "dengi"], ["dengi", "ksiva"], ["ksiva", "telefon"], ["telefon", "kniga"], ["kniga", "bayan"], ["bayan", "butylka"]];
const SINGLES = 4;
const PLACES = [{"name": "Пивко на детской площадке", "code": "111", "note": ""}, {"name": "Пикник в центральном парке", "code": "112", "note": ""}, {"name": "Футбол на коробке", "code": "113", "note": ""}, {"name": "Пивной фестиваль", "code": "121", "note": ""}, {"name": "Набережная", "code": "122", "note": ""}, {"name": "Ночной велозаезд", "code": "123", "note": ""}, {"name": "Шашлык во дворе семьями", "code": "131", "note": ""}, {"name": "Центральная площадь", "code": "132", "note": ""}, {"name": "Прогулка семьями", "code": "133", "note": ""}, {"name": "Баня", "code": "211", "note": ""}, {"name": "Гараж", "code": "212", "note": ""}, {"name": "Помочь с переездом", "code": "213", "note": ""}, {"name": "Караоке-бар", "code": "221", "note": ""}, {"name": "Ресторан", "code": "222", "note": ""}, {"name": "Каток", "code": "223", "note": ""}, {"name": "Юбилей у родни", "code": "231", "note": ""}, {"name": "Ужин у тёщи", "code": "232", "note": ""}, {"name": "Квест-комната", "code": "233", "note": ""}, {"name": "Палатки на речке", "code": "311", "note": ""}, {"name": "Рыбалка", "code": "312", "note": ""}, {"name": "Охота", "code": "313", "note": ""}, {"name": "Пляж", "code": "322", "note": ""}, {"name": "ЙОГА РИТРИТ", "code": "323", "note": "Да пошло оно все в.... оммммм!"}, {"name": "Пикник с семьями", "code": "331", "note": ""}, {"name": "На речку с семьями!", "code": "332", "note": ""}, {"name": "Хайкинг с детьми", "code": "333", "note": "Ад с комарами и детским смехои"}];
const EVENTS = [{"name": "Давайте общую", "code": "***", "text": "Посторонний предлагает всех сфотографировать: «Давайте я вас щёлкну!» Чей-то телефон уже у него в руках. Кадр будет жить вечно, в семейном чате."}, {"name": "Звонит телефон", "code": "***", "text": "Посреди стола, экраном вниз, звонит телефон. Чей, не видно. Звонит долго. На экране, если перевернуть, написано «Любимая»."}, {"name": "Как в две тысячи восьмом", "code": "***", "text": "Спор. Тот самый, из две тысячи восьмого. Все помнят, кто тогда был прав, и все помнят по-разному. Громкость растёт, и нейтральных не осталось."}, {"name": "Ещё по одной", "code": "**1", "text": "У всех снова налито. Кто разлил, никто не видел. Бутылка стоит посередине и смотрит на всех одинаково."}, {"name": "Тост за встречу", "code": "**1", "text": "Пора сказать тост за встречу. Кто-то должен. Все смотрят друг на друга. Стаканы тёплые, пауза растёт, и молчать уже неловко."}, {"name": "Этикетка знакомая", "code": "**1", "text": "Этикетка знакомая, вкус нет. Тот, кто принёс, клянётся, что нормальная. По его лицу видно, что нет. Уже налито."}, {"name": "Ничья фляжка", "code": "**3", "text": "Фляжка. Ничья. Лежит на самом видном месте. Правило все знают. Все делают вид, что не видят, и все видят."}, {"name": "Трезвый разговор", "code": "**3", "text": "Перерыв. Все трезвые, и всем это заметно. Кто-то предлагает обсудить работу. Все соглашаются, и это хуже всего."}, {"name": "Никто не смотрит", "code": "*1*", "text": "Вокруг никого. Совсем. Ни камер, ни прохожих, ни знакомых. Можно всё, и от этого страшно."}, {"name": "Бывшая", "code": "*2*", "text": "В толпе лицо, которое знают все: чья-то бывшая. Чья именно, каждый помнит по-своему. Она вас увидела. Идёт сюда. Улыбается так, что становится страшно."}, {"name": "Обознался", "code": "*2*", "text": "Человек машет вам как родным и идёт сюда, раскинув руки. Он точно вас знает. Вы его нет. Он уже близко, и у него слёзы."}, {"name": "Стример", "code": "*2*", "text": "Парень с кольцевой лампой ведёт стрим и уже направил камеру на вас: «Ребят, скажите что-нибудь моей аудитории». Аудитория: четыреста человек и ваша тётя."}, {"name": "Тот самый взгляд", "code": "*3*", "text": "На вас смотрят. Тот самый взгляд, после которого обычно что-то запрещают. Пока молча."}, {"name": "Дождь стеной", "code": "1**", "text": "Небо решило, что вам хватит. Ливень такой, что ближайшая крыша это козырёк, под которым уже стоят трое с той же мыслью. Один из них курит вам в лицо."}, {"name": "Салют Победы", "code": "1**", "text": "На скамейке стоит коробка с надписью «Салют Победы». Ничья. Инструкция на китайском, рядом зажигалка. Ветер в сторону окон."}, {"name": "Собака", "code": "1**", "text": "К компании подошла собака. Большая. Без хозяина. Она обнюхивает каждого по очереди и выбирает, с кем идти домой. Отказать ей трудно."}, {"name": "Граждане, что празднуем?", "code": "1*1", "text": "Бобик подъезжает так тихо, что вы замечаете его, только когда сержант уже читает этикетку на вашей бутылке. Вслух. С выражением. Лейтенант молодой, ему всё интересно."}, {"name": "Три минуты", "code": "1*1", "text": "Приложение показывает машину в трёх минутах. Уже двадцать минут. Водитель не отвечает. Холодает. Пешком отсюда сорок минут, и это если знать дорогу."}, {"name": "Бабушки на лавке", "code": "11*", "text": "Три бабушки на лавке замолчали одновременно. Они всё слышали. Они всё запомнят. Одна из них знает вашу маму."}, {"name": "Качели", "code": "111", "text": "Качели рассчитаны на ребёнка. Одни. Свободные. Скрипят так, будто зовут. Цепь на вид выдержит. На вид."}, {"name": "Мангал не разгорается", "code": "111", "text": "Мангал не разгорался полчаса, зато теперь горит всё: угли, решётка, чей-то рукав. Мясо ещё в маринаде."}, {"name": "Милиция!", "code": "111", "text": "Добропорядочные жильцы не могут больше терпеть, к вам едет наряд милиции"}, {"name": "Свет в окне", "code": "111", "text": "Из окна над площадкой кричат: «Я сейчас спущусь!» Спускаться начали пять минут назад. Окно не закрывается, оттуда слышно, как ищут ключи."}, {"name": "Дружинники", "code": "112", "text": "Двое с повязками идут прямо к вашему пледу. У одного планшет, у другого лицо. Пакет стоит на самом видном месте."}, {"name": "Камера повернулась", "code": "112", "text": "Камера на столбе только что повернулась в вашу сторону. Медленно. Красный огонёк моргнул."}, {"name": "Приспичело", "code": "112", "text": "Это был пир! Но за все нужно платить, а до туалета ой как далеко"}, {"name": "Мяч улетел", "code": "113", "text": "Мяч улетел за забор к соседям, у которых собака. Собака уже вышла. Мяч был последний."}, {"name": "На интерес", "code": "113", "text": "Подходят пацаны лет четырнадцати: «Дядь, на нас сыграете? На интерес». Интерес не уточняют. Их шестеро, и они не запыхались."}, {"name": "Водички нету?", "code": "12*", "text": "Их четверо, и они очень рады вас видеть. Самый широкий, в олимпийке на голое тело, обнимает за плечо как родного: «Пацаны, водички нету? Чисто маме позвонить». Его друг уже держит ваш пакет, чтобы вам было удобнее."}, {"name": "Ларёк закрывается", "code": "12*", "text": "Продавщица опускает жалюзи ровно на ваших глазах. Через щель видна полка. На полке всё, что нужно. Она видит, что вы видите."}, {"name": "Поливалка", "code": "12*", "text": "Из-за угла выезжает поливальная машина. Водитель видит вас. Он не сбавляет. Он улыбается."}, {"name": "Досмотр", "code": "121", "text": "На входе досматривают сумки. Ваша сумка звенит. Охранник уже знает чем, но хочет, чтобы вы сказали сами."}, {"name": "Заказы по сто", "code": "122", "text": "Парень с гитарой заканчивает песню и объявляет: «А теперь заказы, сто рублей». Смотрит на вас. Толпа тоже смотрит на вас."}, {"name": "Массовка", "code": "122", "text": "Свадебный фотограф просит вас выйти из кадра. Потом просит встать в кадр: «для массовки». Невеста смотрит с надеждой."}, {"name": "Метро закрыли", "code": "122", "text": "Двери метро закрыты, за ними охранник разводит руками. Последний автобус пение. Очередь смотрит на вас, потому что вы ближе."}, {"name": "Спит сидя", "code": "2*1", "text": "За вашим столом спит человек. Сидя. С открытыми глазами. Вы его не приглашали. Он уснул на чьей-то куртке, и его никто не хочет будить первым."}, {"name": "Веник", "code": "211", "text": "Веник один на всех, и он уже не первой свежести. Парилка ждёт. Тот, кто парит, выглядит опасно бодрым."}, {"name": "Третий заход", "code": "211", "text": "Дверь парилки открывается, оттуда голос: «Кто со мной на третий?» Термометр показывает цифру, которую вы не знали."}, {"name": "Куртки нет", "code": "22*", "text": "Номерки у всех есть. Курток нет ни у кого. Гардеробщица говорит, что их только что забрал «ваш друг». Ваши друзья все здесь. На улице плюс два."}, {"name": "Одноклассник", "code": "22*", "text": "Человек в форме заведения присматривается: «Ребята! Мы же в одном классе!» Он помнит всех вас. Вы его нет. Он помнит и то, кто ему сколько должен."}, {"name": "Пора", "code": "22*", "text": "Свет мигнул два раза. Это значит «пора». Никто не встаёт. Свет мигает третий раз, дольше."}, {"name": "Розетка", "code": "22*", "text": "В зале одна розетка. Возле неё сидит человек с тремя телефонами на зарядке и лицом хозяина розетки. Он готов уступить место. Не бесплатно и не сразу."}, {"name": "Фейсконтроль", "code": "22*", "text": "Охранник смотрит на ваши кроссовки дольше, чем на паспорт. «Сегодня закрытое мероприятие». За его спиной оно явно открыто."}, {"name": "Все остаются на местах", "code": "221", "text": "Свет включают полностью. В дверях люди в форме: «Все остаются на местах». Кто-то встаёт. Не из ваших. Пока."}, {"name": "Кальян потух", "code": "221", "text": "Кальянщик подходит с углями и лицом человека, который всё видел. «Вы его ещё и трясли?» Счёт за кальян уже больше счёта за стол."}, {"name": "Летит стул", "code": "221", "text": "За соседним столом что-то началось. Летит стул. Не в вас. Пока. Охрана идёт не туда.\n\nНеудачная драка и вас выгонят в:\n>> Крыльцо с охранн   const a=fromEl.getBoundingClientRect(), b=toEl.getBoundingClientRect();
  const clone=fromEl.cloneNode(true); clone.classList.remove('click'); clone.classList.add('fly');
  clone.style.left=a.left+'px'; clone.style.top=a.top+'px'; clone.style.setProperty('--w', a.width+'px'); clone.style.width=a.width+'px'; clone.style.margin='0';
  document.body.appendChild(clone); fromEl.style.visibility='hidden';
  requestAnimationFrame(()=>{ clone.style.left=b.left+'px'; clone.style.top=b.top+'px'; clone.style.setProperty('--w', b.width+'px'); clone.style.width=b.width+'px'; clone.style.transform='rotateY(180deg)'; });
  setTimeout(()=>{ clone.remove(); done(); }, 600);
  setTimeout(()=>{ /* середина переворота: подменяем лицо */ const tmp=document.createElement('div'); tmp.innerHTML=faceHTML; const face=tmp.firstElementChild; face.classList.add('fly'); face.style.left=clone.style.left; face.style.top=clone.style.top; face.style.setProperty('--w', clone.style.width); face.style.width=clone.style.width; face.style.transform='rotateY(180deg) scaleX(-1)'; face.style.transition='none'; clone.replaceWith(face); setTimeout(()=>face.remove(),330); }, 280);
}
function openStreet(i){ const p=G.street[i]; if(p.up) return; const from=document.querySelector(`#zstreet .pc[data-s="${i}"]`); const to=document.getElementById('zplace');
  fly(from, to, placeHTML(p,'big'), ()=>{ p.up=true; G.open=p; G.event=null; render(); }); }
function tryEvent(){ if(!G.open){ shake(); return; } const ev=G.events[0]; const top=document.getElementById('topcard');
  if(matches(G.open, ev)){ const to=document.getElementById('zevent'); fly(top, to, eventHTML(ev,'big'), ()=>{ G.events.shift(); if(G.event) G.discard++; G.event=ev; render(); }); }
  else { const x=document.createElement('div'); x.className='cross'; x.textContent='✕'; top.appendChild(x); requestAnimationFrame(()=>requestAnimationFrame(()=>x.classList.add('fade'))); setTimeout(()=>x.remove(),1600); } }
function shake(){ const z=document.getElementById('zplace'); z.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:300}); }
function nextCard(){ if(G.events.length<2) return; G.events.push(G.events.shift()); render(); }
document.getElementById('newgame').onclick=()=>newGame(false);
document.getElementById('replay').onclick=()=>newGame(true);
document.getElementById('next').onclick=nextCard;
document.getElementById('zstreet').addEventListener('click',e=>{ const c=e.target.closest('.pc.click'); if(c) openStreet(+c.dataset.s); });
document.getElementById('zdeck').addEventListener('click',e=>{ if(e.target.closest('#topcard')) tryEvent(); });
document.querySelector('.me').addEventListener('click',e=>{ const me=G.players[0];
  const b=e.target.closest('button'); if(b){ me.lay=best(me.hand); render(); return; }
  const cd=e.target.closest('.card'); if(cd){ if(cd.classList.contains('blocked')) return; const c=me.hand.find(x=>x.i===+cd.dataset.i); if(!c) return;
    if(me.lay.includes(c)) me.lay=me.lay.filter(x=>x!==c); else if(me.lay.length<SLOTS&&!me.lay.some(x=>x.t===c.t)) me.lay.push(c); render(); return; }
  const pc=e.target.closest('.pc.click'); if(pc && G.phase==='sbory'){ const p=me.phand.find(x=>x.j===+pc.dataset.j); me.pick=p; makeStreet(); } });
loadLive().then(()=>{ document.getElementById('src').textContent='база: живая'; }).catch(e=>{ document.getElementById('src').textContent='база: снимок ('+e.message+')'; }).finally(()=>newGame(false));
</script>
